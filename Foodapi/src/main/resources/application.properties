spring.application.name=Food_WebApp

# Load .env file
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/food_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Groq AI - GPT-OSS-20B
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:openai/gpt-oss-20b}

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# LocalStack S3
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:foodcode}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:test}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:test}

# JWT Authentication
jwt.secret=${JWT_SECRET}

# Razorpay Payment Gateway
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}